# EU second-hand marketplace catalog
#
# Deliverable (a): the leading national "sell your used stuff" platform(s) for
# every EU-27 member state, plus the pan-EU players.
#
# Every entry carries the config the search engines need, so this file is both
# documentation and the runtime registry. Adding a marketplace = editing YAML.
#
# Field notes
#   rank            1 = the platform locals actually use first. 2+ = strong alternates.
#   engine          which search engine drives it (see ufeu/adapters/).
#                   `manual` means no automated search is offered: the app emits a
#                   deep search link instead. Honest > fake.
#   confidence      how sure we are about the "most used" claim (high/medium/low).
#   account         what it takes to register (deliverable (b)).
#   shipping        how goods get to Portugal (deliverable (f)).
#
# Rankings are a best-effort snapshot for 2026 from public traffic/MAU reporting;
# re-check before betting money on them. `scripts/verify_catalog.py` re-probes
# reachability and search shape.

version: 1
updated: "2026-08-21"

countries:
  AT: {name: Austria,        currency: EUR, lang: de}
  BE: {name: Belgium,        currency: EUR, lang: nl}
  BG: {name: Bulgaria,       currency: BGN, lang: bg}
  HR: {name: Croatia,        currency: EUR, lang: hr}
  CY: {name: Cyprus,         currency: EUR, lang: el}
  CZ: {name: Czechia,        currency: CZK, lang: cs}
  DK: {name: Denmark,        currency: DKK, lang: da}
  EE: {name: Estonia,        currency: EUR, lang: et}
  FI: {name: Finland,        currency: EUR, lang: fi}
  FR: {name: France,         currency: EUR, lang: fr}
  DE: {name: Germany,        currency: EUR, lang: de}
  GR: {name: Greece,         currency: EUR, lang: el}
  HU: {name: Hungary,        currency: HUF, lang: hu}
  IE: {name: Ireland,        currency: EUR, lang: en}
  IT: {name: Italy,          currency: EUR, lang: it}
  LV: {name: Latvia,         currency: EUR, lang: lv}
  LT: {name: Lithuania,      currency: EUR, lang: lt}
  LU: {name: Luxembourg,     currency: EUR, lang: fr}
  MT: {name: Malta,          currency: EUR, lang: en}
  NL: {name: Netherlands,    currency: EUR, lang: nl}
  PL: {name: Poland,         currency: PLN, lang: pl}
  PT: {name: Portugal,       currency: EUR, lang: pt}
  RO: {name: Romania,        currency: RON, lang: ro}
  SK: {name: Slovakia,       currency: EUR, lang: sk}
  SI: {name: Slovenia,       currency: EUR, lang: sl}
  ES: {name: Spain,          currency: EUR, lang: es}
  SE: {name: Sweden,         currency: SEK, lang: sv}
  EU: {name: Pan-European,   currency: EUR, lang: en}

marketplaces:

  # ───────────────────────── Pan-European ─────────────────────────

  - id: ebay
    name: eBay (EU sites)
    country: EU
    rank: 1
    scope: pan_eu
    site: https://www.ebay.de
    focus: [general, electronics, collectibles, parts]
    engine: ebay_browse
    default_enabled: true
    confidence: high
    why: >-
      The only large EU marketplace with a first-class, documented, free public
      search API. Nine EU sites (DE/FR/IT/ES/IE/NL/AT/BE/PL) behind one call, and
      "used" is a real filter rather than a guess. Start here.
    engine_config:
      auth_url: https://api.ebay.com/identity/v1/oauth2/token
      search_url: https://api.ebay.com/buy/browse/v1/item_summary/search
      scope: https://api.ebay.com/oauth/api_scope
      marketplaces: [EBAY_DE, EBAY_FR, EBAY_IT, EBAY_ES, EBAY_IE, EBAY_NL, EBAY_AT, EBAY_BE, EBAY_PL]
      condition_ids: ["3000", "4000", "5000", "6000", "7000"]
      limit: 50
    account:
      required_for_search: true
      kind: api_key
      signup_url: https://developer.ebay.com/my/keys
      credentials: [client_id, client_secret]
      automatable: true
      notes: >-
        Free developer account, self-service. Create a production keyset, then
        `ufeu accounts set ebay --client-id ... --client-secret ...`. No scraping,
        no ToS grey zone, ~5000 calls/day on the default tier.
    shipping:
      native_to_pt: true
      notes: eBay International Shipping / seller-declared EU shipping. Filter by "ships to PT" in the UI.

  - id: vinted
    name: Vinted (EU pool)
    country: EU
    rank: 1
    scope: pan_eu
    site: https://www.vinted.pt
    focus: [fashion, kids, home, books]
    engine: vinted
    default_enabled: true
    dedupe_group: vinted
    confidence: high
    why: >-
      #1 second-hand app by MAU in FR/PT/ES/IT/LT and top-3 in most of the rest of
      the EU. Crucially, Vinted runs *connected country pools*: one query against
      vinted.pt already returns sellers across the Iberian/EU pool, so a single
      endpoint covers most of Europe. The per-country entries below exist for
      catalogue completeness and are disabled by default to avoid duplicate hits.
    engine_config:
      base_url: https://www.vinted.pt
      per_page: 48
      order: newest_first
    account:
      required_for_search: false
      kind: session
      signup_url: https://www.vinted.pt/member/signup
      signup_method: [email, google, facebook, apple]
      captcha: true
      automatable: false
      notes: >-
        Search works anonymously (the engine bootstraps an anonymous session
        cookie). An account is only needed to message sellers and buy. Sign up
        by hand once, then import the session cookie via the Accounts tab.
    shipping:
      native_to_pt: true
      notes: >-
        Best-in-class. Vinted's integrated shipping covers PT natively (CTT,
        DPD, Vinted Go lockers) and cross-border inside the connected pool, with
        Buyer Protection. This is the single easiest route for goods into Portugal.

  - id: catawiki
    name: Catawiki
    country: EU
    rank: 2
    scope: pan_eu
    site: https://www.catawiki.com
    focus: [collectibles, art, watches, vintage]
    engine: html
    default_enabled: false
    confidence: high
    why: Pan-EU curated auction house for used collectibles; NL-based, ships EU-wide.
    engine_config:
      search_url: "https://www.catawiki.com/en/search?q={q}"
      item: "div[data-testid='lot-card']"
      fields:
        title: {sel: "h3", attr: text}
        url: {sel: "a", attr: href}
        price: {sel: "[data-testid='lot-card-bid']", attr: text}
        image: {sel: "img", attr: src}
    account:
      required_for_search: false
      kind: session
      signup_url: https://www.catawiki.com/en/register
      automatable: false
    shipping:
      native_to_pt: true
      notes: Sellers quote shipping to PT at checkout.

  - id: vestiaire
    name: Vestiaire Collective
    country: EU
    rank: 3
    scope: pan_eu
    site: https://www.vestiairecollective.com
    focus: [luxury_fashion]
    engine: html
    default_enabled: false
    confidence: high
    why: The pan-EU platform for pre-owned designer fashion; authenticates items.
    engine_config:
      search_url: "https://www.vestiairecollective.com/search/?q={q}"
      item: "div[data-cy='productCard']"
      fields:
        title: {sel: "[data-cy='productCard_brand']", attr: text}
        url: {sel: "a", attr: href}
        price: {sel: "[data-cy='productCard_price']", attr: text}
        image: {sel: "img", attr: src}
    account: {required_for_search: false, kind: session, signup_url: "https://www.vestiairecollective.com/register/", automatable: false}
    shipping: {native_to_pt: true, notes: Centralised authentication hub then onward shipping to PT.}

  - id: backmarket
    name: Back Market
    country: EU
    rank: 3
    scope: pan_eu
    site: https://www.backmarket.pt
    focus: [electronics_refurbished]
    engine: html
    default_enabled: false
    confidence: high
    why: >-
      Not peer-to-peer, but the reference EU marketplace for refurbished
      electronics with a Portuguese storefront and warranty. Worth having in the
      comparison when the query is a phone/laptop.
    engine_config:
      search_url: "https://www.backmarket.pt/pt-pt/search?q={q}"
      item: "article"
      fields:
        title: {sel: "h2", attr: text}
        url: {sel: "a", attr: href}
        price: {sel: "[data-qa='productCardPrice']", attr: text}
        image: {sel: "img", attr: src}
    account: {required_for_search: false, kind: none, automatable: true}
    shipping: {native_to_pt: true, notes: Ships to PT domestically, free over threshold.}

  - id: facebook_marketplace
    name: Facebook Marketplace
    country: EU
    rank: 2
    scope: pan_eu
    site: https://www.facebook.com/marketplace
    focus: [general, furniture, local]
    engine: manual
    default_enabled: true
    confidence: high
    why: >-
      By raw volume this is the biggest second-hand venue in most EU countries,
      especially for furniture and local pickup. But it is strictly local-radius,
      has no public API, and automated access is an explicit ToS violation that
      gets accounts banned. Included as a deep link only — the app builds the
      search URL, you click it.
    engine_config:
      search_url: "https://www.facebook.com/marketplace/search/?query={q}"
    account:
      required_for_search: true
      kind: session
      automatable: false
      notes: Use your existing personal account. Do not automate this one.
    shipping:
      native_to_pt: false
      notes: Local pickup culture; cross-border almost always needs a private arrangement.

  # ───────────────────────── National #1s ─────────────────────────

  - id: willhaben_at
    name: willhaben.at
    country: AT
    rank: 1
    scope: national
    site: https://www.willhaben.at
    focus: [general, furniture, electronics, vehicles]
    engine: json_api
    default_enabled: true
    confidence: high
    why: Austria's dominant classifieds site — the local Kleinanzeigen, ~4M+ monthly users in a 9M country.
    engine_config:
      mode: next_data
      search_url: "https://www.willhaben.at/iad/kaufen-und-verkaufen/marktplatz?keyword={q}"
      root: "props.pageProps.searchResult.advertSummaryList.advertSummary"
      fields:
        id: id
        title: description
        url: "contextLinkList.contextLink[?id=='iadShareLink'].uri | [0]"
        attrs: "attributes.attribute"
      attr_map: {price: PRICE, image: "IMAGE/1", location: LOCATION, postcode: POSTCODE}
    account:
      required_for_search: false
      kind: session
      signup_url: https://www.willhaben.at/iad/registrieren
      signup_method: [email]
      captcha: true
      automatable: false
    shipping:
      native_to_pt: false
      notes: >-
        willhaben has "Kaufabwicklung" with paid shipping, but Austrian sellers
        rarely ship outside AT/DE. Route via a DE/AT forwarder or ask the seller
        to accept a prepaid label you generate (see shipping strategy `prepaid_label`).

  - id: tweedehands_be
    name: 2dehands.be / 2ememain.be
    country: BE
    rank: 1
    scope: national
    site: https://www.2dehands.be
    focus: [general, furniture, electronics]
    engine: json_api
    default_enabled: true
    confidence: high
    why: The Belgian arm of the Marktplaats (Adevinta) stack and the country's #1 general classifieds site.
    engine_config:
      mode: rest
      search_url: "https://www.2dehands.be/lrp/api/search?query={q}&limit={limit}&offset=0"
      root: listings
      price_divisor: 100        # the API quotes cents
      fields:
        id: itemId
        title: title
        url: vipUrl
        price: "priceInfo.priceCents"
        image: "pictures[0].largeUrl"
        location: "location.cityName"
        seller: "sellerInformation.sellerName"
        posted: date
    account: {required_for_search: false, kind: session, signup_url: "https://www.2dehands.be/identity/v2/registration", captcha: true, automatable: false}
    shipping:
      native_to_pt: false
      notes: Native shipping only within BE/NL. Cross-border needs a prepaid label or forwarder.

  - id: olx_bg
    name: OLX.bg
    country: BG
    rank: 1
    scope: national
    site: https://www.olx.bg
    focus: [general, electronics, vehicles]
    engine: olx
    default_enabled: true
    confidence: high
    why: OLX is the leading general classifieds platform in Bulgaria; Bazar.bg is the local challenger.
    engine_config: {base_url: "https://www.olx.bg", currency: BGN}
    account: {required_for_search: false, kind: session, signup_url: "https://www.olx.bg/account/", signup_method: [email, phone], captcha: true, automatable: false}
    shipping: {native_to_pt: false, notes: "Econt/Speedy domestic only; needs forwarder or prepaid label."}

  - id: bazar_bg
    name: Bazar.bg
    country: BG
    rank: 2
    scope: national
    site: https://bazar.bg
    focus: [general]
    engine: html
    default_enabled: false
    confidence: medium
    why: Long-running Bulgarian classifieds portal, strong in electronics and hobby goods.
    engine_config:
      search_url: "https://bazar.bg/obiavi?q={q}"
      item: "div.listItemLink, a.listItemLink"
      fields:
        title: {sel: ".listItemTitle", attr: text}
        url: {sel: "a", attr: href}
        price: {sel: ".listItemPrice", attr: text}
        image: {sel: "img", attr: src}
    account: {required_for_search: false, kind: session, automatable: false}
    shipping: {native_to_pt: false}

  - id: njuskalo_hr
    name: Njuškalo
    country: HR
    rank: 1
    scope: national
    site: https://www.njuskalo.hr
    focus: [general, vehicles, electronics]
    engine: html
    default_enabled: true
    confidence: high
    why: Croatia's dominant classifieds site (Styria group), far ahead of any local rival.
    engine_config:
      search_url: "https://www.njuskalo.hr/?ctl=search_ads&keywords={q}"
      item: "li.EntityList-item--Regular"
      fields:
        title: {sel: ".entity-title a", attr: text}
        url: {sel: ".entity-title a", attr: href}
        price: {sel: ".price--eur", attr: text}
        image: {sel: "img", attr: src}
        location: {sel: ".entity-pub-date", attr: text}
    account: {required_for_search: false, kind: session, signup_url: "https://www.njuskalo.hr/registracija", captcha: true, automatable: false}
    shipping: {native_to_pt: false, notes: "Overseas/Hrvatska pošta; usually needs a prepaid label."}

  - id: bazaraki_cy
    name: Bazaraki
    country: CY
    rank: 1
    scope: national
    site: https://www.bazaraki.com
    focus: [general, vehicles, property]
    engine: html
    default_enabled: true
    confidence: high
    why: The unambiguous #1 classifieds site in Cyprus, essentially the whole market.
    engine_config:
      search_url: "https://www.bazaraki.com/search/?q={q}"
      item: "div.advert"
      fields:
        title: {sel: "a.advert__content-title", attr: text}
        url: {sel: "a.advert__content-title", attr: href}
        price: {sel: ".advert__content-price", attr: text}
        image: {sel: "img", attr: src}
        location: {sel: ".advert__content-region", attr: text}
    account: {required_for_search: false, kind: session, signup_url: "https://www.bazaraki.com/accounts/signup/", automatable: false}
    shipping: {native_to_pt: false, notes: "Island market — shipping to PT is expensive; treat as low priority unless the item is rare."}

  - id: bazos_cz
    name: Bazoš.cz
    country: CZ
    rank: 1
    scope: national
    site: https://www.bazos.cz
    focus: [general, electronics, hobby]
    engine: html
    default_enabled: true
    confidence: high
    why: >-
      Czechia's highest-traffic peer-to-peer ads site. Deliberately primitive
      HTML, no JS, no bot defences — which makes it one of the easiest and most
      reliable sources in this whole catalogue.
    engine_config:
      search_url: "https://www.bazos.cz/search.php?hledat={q}&hlokalita=&humkreis=25&cenaod=&cenado="
      item: "div.inzeraty"
      fields:
        title: {sel: "h2.nadpis a", attr: text}
        url: {sel: "h2.nadpis a", attr: href}
        price: {sel: ".inzeratycena b", attr: text}
        image: {sel: "img.obrazek", attr: src}
        description: {sel: ".popis", attr: text}
        location: {sel: ".inzeratylok", attr: text}
      currency: CZK
    account: {required_for_search: false, kind: none, signup_url: "https://www.bazos.cz/pridat-inzerat.php", automatable: true, notes: "Posting needs only email + SMS confirmation; browsing needs nothing."}
    shipping: {native_to_pt: false, notes: "Zásilkovna/Packeta reaches PT cheaply — Packeta has PT pickup points. Good prepaid-label candidate."}

  - id: sbazar_cz
    name: Sbazar.cz
    country: CZ
    rank: 2
    scope: national
    site: https://www.sbazar.cz
    focus: [general]
    engine: json_api
    default_enabled: false
    confidence: high
    why: Seznam's classifieds arm; second to Bazoš but better mobile reach.
    engine_config:
      mode: rest
      search_url: "https://www.sbazar.cz/api/v1/items/search?query={q}&limit={limit}"
      root: items
      fields: {id: id, title: name, url: url, price: price, image: "images[0].url", location: "locality.name"}
      currency: CZK
    account: {required_for_search: false, kind: session, automatable: false}
    shipping: {native_to_pt: false}

  - id: dba_dk
    name: DBA (Den Blå Avis)
    country: DK
    rank: 1
    scope: national
    site: https://www.dba.dk
    focus: [general, furniture, vehicles]
    engine: json_api
    default_enabled: true
    confidence: high
    why: Denmark's default second-hand marketplace for four decades, now Schibsted-owned.
    engine_config:
      mode: next_data
      search_url: "https://www.dba.dk/soeg/?soeg={q}"
      root: "props.pageProps.searchResult.docs"
      fields: {id: id, title: heading, url: canonical_url, price: "price.amount", image: "image.url", location: location}
      currency: DKK
    account: {required_for_search: false, kind: session, signup_url: "https://www.dba.dk/bruger/opret", captcha: true, automatable: false}
    shipping: {native_to_pt: false, notes: "DAO/GLS domestic. Prepaid label or forwarder for PT."}

  - id: okidoki_ee
    name: Okidoki.ee
    country: EE
    rank: 1
    scope: national
    site: https://www.okidoki.ee
    focus: [general]
    engine: html
    default_enabled: true
    confidence: medium
    why: Estonia's leading general classifieds site; Osta.ee is the auction-format alternative.
    engine_config:
      search_url: "https://www.okidoki.ee/buy/all/?query={q}"
      item: "div.horiz-offer-card"
      fields:
        title: {sel: ".horiz-offer-card__title-link", attr: text}
        url: {sel: ".horiz-offer-card__title-link", attr: href}
        price: {sel: ".horiz-offer-card__price-value", attr: text}
        image: {sel: "img", attr: src}
    account: {required_for_search: false, kind: session, automatable: false}
    shipping: {native_to_pt: false, notes: "Omniva/Itella. Baltic → PT via prepaid label works but is slow (7-12d)."}

  - id: osta_ee
    name: Osta.ee
    country: EE
    rank: 2
    scope: national
    site: https://www.osta.ee
    focus: [general, auctions, collectibles]
    engine: html
    default_enabled: false
    confidence: medium
    why: Estonia's eBay-style auction site, strong for collectibles and electronics.
    engine_config:
      search_url: "https://www.osta.ee/search?q={q}"
      item: "div.item-card"
      fields:
        title: {sel: "a.item-card__title", attr: text}
        url: {sel: "a.item-card__title", attr: href}
        price: {sel: ".item-card__price", attr: text}
        image: {sel: "img", attr: src}
    account: {required_for_search: false, kind: session, automatable: false}
    shipping: {native_to_pt: false}

  - id: tori_fi
    name: Tori.fi
    country: FI
    rank: 1
    scope: national
    site: https://www.tori.fi
    focus: [general, furniture, electronics]
    engine: json_api
    default_enabled: true
    confidence: high
    why: Finland's dominant peer-to-peer marketplace (Schibsted), now merged with Oikotie's goods vertical.
    engine_config:
      mode: next_data
      search_url: "https://www.tori.fi/recommerce/forsale/search?q={q}"
      root: "props.pageProps.initialData.docs"
      fields: {id: id, title: heading, url: canonical_url, price: "price.amount", image: "image.url", location: location}
    account: {required_for_search: false, kind: session, signup_url: "https://www.tori.fi/account/register", captcha: true, automatable: false}
    shipping: {native_to_pt: false, notes: "Posti/Matkahuolto domestic. Nordic → PT is pricey; prefer Vinted for FI fashion."}

  - id: leboncoin_fr
    name: leboncoin
    country: FR
    rank: 1
    scope: national
    site: https://www.leboncoin.fr
    focus: [general, furniture, electronics, vehicles]
    engine: manual
    default_enabled: true
    confidence: high
    why: >-
      France's #1 general classifieds site by a wide margin and, for non-fashion
      goods, the single most valuable EU market to search. Downgraded to `manual`
      on purpose: leboncoin sits behind DataDome, and hammering it from a server
      gets the IP blocked within minutes. The app emits a deep search link; if you
      want it automated, drive it with your own logged-in browser session (see
      docs/02-accounts.md, "browser-session engines").
    engine_config:
      search_url: "https://www.leboncoin.fr/recherche?text={q}"
      api_hint: "POST https://api.leboncoin.fr/finder/search — requires DataDome cookie + api_key header"
    account:
      required_for_search: false
      kind: session
      signup_url: https://www.leboncoin.fr/compte/creation
      signup_method: [email, phone]
      captcha: true
      automatable: false
    shipping:
      native_to_pt: true
      notes: >-
        leboncoin has integrated "Colis" shipping (Mondial Relay / Colissimo).
        Cross-border to PT is not offered natively, but France is the strongest
        corridor for the diaspora-van route — see shipping strategy `diaspora_van`.

  - id: kleinanzeigen_de
    name: Kleinanzeigen.de
    country: DE
    rank: 1
    scope: national
    site: https://www.kleinanzeigen.de
    focus: [general, furniture, electronics, bikes]
    engine: html
    default_enabled: true
    confidence: high
    why: >-
      Germany's #1 classifieds platform (the former eBay Kleinanzeigen, spun out
      in 2021), 30M+ users. The deepest pool of used goods in the EU, and German
      sellers price hardware realistically.
    engine_config:
      search_url: "https://www.kleinanzeigen.de/s-{q}/k0"
      slugify_query: true
      item: "article.aditem"
      fields:
        id: {attr: "data-adid"}
        title: {sel: ".text-module-begin a", attr: text}
        url: {sel: ".text-module-begin a", attr: href}
        price: {sel: ".aditem-main--middle--price-shipping--price", attr: text}
        image: {sel: ".imagebox img", attr: src}
        location: {sel: ".aditem-main--top--left", attr: text}
        description: {sel: ".aditem-main--middle--description", attr: text}
      rate_limit_rps: 0.5
    account:
      required_for_search: false
      kind: session
      signup_url: https://www.kleinanzeigen.de/m-einloggen.html
      signup_method: [email]
      captcha: true
      automatable: false
      notes: Aggressive bot detection. Keep rate limits low and prefer a residential connection.
    shipping:
      native_to_pt: false
      notes: >-
        Has integrated DHL/Hermes shipping but domestic-only. Germany is the best
        market for the `forwarder_de` strategy (myGermany, Meest) and for
        prepaid labels — German sellers are used to "Paket" workflows.

  - id: vendora_gr
    name: Vendora.gr
    country: GR
    rank: 1
    scope: national
    site: https://www.vendora.gr
    focus: [general, fashion, electronics]
    engine: html
    default_enabled: true
    confidence: medium
    why: >-
      Greece's largest peer-to-peer marketplace for general goods. The Greek market
      is fragmented (car.gr owns vehicles, Skroutz owns retail), so confidence is
      medium and Vinted GR is worth running alongside.
    engine_config:
      search_url: "https://www.vendora.gr/search?q={q}"
      item: "div.product-card"
      fields:
